<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B4441F; } a:hover { color: #8E3416; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBFBFC; color: #14161A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden;">

  <div style="padding: 20px 20px 14px; border-bottom: 1px solid #E2E2E6; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #83868E;">Ваш профиль</div>
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <span class="num" style="font-size: 38px; font-weight: 600; letter-spacing: 0.04em; line-height: 1;">IRA</span>
      <span style="font-size: 13px; color: #3C3F46; line-height: 1.3;">Исследователь<br>Практик · Творец</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="flex: 1; height: 4px; background: #E2E2E6; border-radius: 2px; overflow: hidden;">
        <div style="width: 74%; height: 100%; background: #B4441F;"></div>
      </div>
      <span class="num" style="font-size: 12px; color: #55585F;">74% уверенность</span>
    </div>
  </div>

  <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 14px; font-weight: 600;">Интересы</span>
        <span style="font-size: 10px; color: #83868E;">вы · норма</span>
      </div>
      <sc-for list="{{riasec}}" as="row" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 30px; align-items: center; gap: 10px;">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <span style="font-size: 12px; color: #3C3F46;">{{row.label}}</span>
            <div style="position: relative; height: 14px;">
              <div style="position: absolute; inset: 4px 0; background: #EDEDF0; border-radius: 3px;"></div>
              <div style="position: absolute; left: 0; top: 4px; bottom: 4px; width: {{row.norm}}; background: #C9CBD1; border-radius: 3px;"></div>
              <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{row.value}}; background: #B4441F; border-radius: 3px;"></div>
            </div>
          </div>
          <span class="num" style="font-size: 13px; font-weight: 600; text-align: right;">{{row.n}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 14px; font-weight: 600;">Когнитивные навыки</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
        <sc-for list="{{cognitive}}" as="c" hint-placeholder-count="4">
          <div style="border: 1px solid #E2E2E6; border-radius: 8px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
            <span class="num" style="font-size: 22px; font-weight: 600; line-height: 1;">{{c.n}}</span>
            <span style="font-size: 10px; color: #55585F; line-height: 1.35;">{{c.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="border-top: 1px solid #E2E2E6; background: #FFFFFF; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px;">
    <div style="height: 46px; flex: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #D6D6DB; border-radius: 6px; font-size: 13px; font-weight: 500;">PDF</div>
    <div style="height: 46px; flex: 2; display: flex; align-items: center; justify-content: center; background: #14161A; color: #FBFBFC; border-radius: 6px; font-size: 13px; font-weight: 500;">Построить план</div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const pct = (n) => n + '%';
    return {
      riasec: [
        { label: 'Исследовательские', n: 78, norm: 52 },
        { label: 'Практические', n: 66, norm: 55 },
        { label: 'Творческие', n: 61, norm: 58 },
        { label: 'Социальные', n: 54, norm: 61 },
        { label: 'Предпринимательские', n: 48, norm: 57 },
        { label: 'Конвенциональные', n: 44, norm: 53 },
      ].map((r) => ({ ...r, value: pct(r.n), norm: pct(r.norm) })),
      cognitive: [
        { label: 'Логическое мышление', n: 80 },
        { label: 'Рабочая память', n: 71 },
        { label: 'Скорость обработки', n: 62 },
        { label: 'Внимание', n: 58 },
      ],
    };
  }
}
</script>
</body>
</html>
