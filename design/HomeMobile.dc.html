<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F6F4A; } a:hover { color: #145235; }
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F5F1; color: #14171C; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden;">

  <div style="padding: 26px 18px 12px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">Даулет</span>
      <div style="width: 38px; height: 38px; border-radius: 50%; background: #E4E2DB; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Д</div>
    </div>

    <div style="background: #14171C; color: #F6F5F1; border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px;">
      <span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #9C9A93;">Незавершённый замер</span>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;">Осталось 34 из 86</span>
        <span style="font-size: 13px; color: #B8B4AA;">Примерно 9 минут. Ответы сохранены.</span>
      </div>
      <div style="height: 6px; background: #33373E; border-radius: 3px; overflow: hidden;">
        <div style="width: 60%; height: 100%; background: #1F6F4A; border-radius: 3px;"></div>
      </div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: center; background: #F6F5F1; color: #14171C; border-radius: 10px; font-size: 15px; font-weight: 600;">Продолжить</div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4E2DB; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 14px; font-weight: 600;">Ваш последний профиль</span>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span class="tnum" style="font-size: 28px; font-weight: 700; letter-spacing: 0.02em; line-height: 1;">IRA</span>
        <span style="font-size: 12px; color: #4A5059; line-height: 1.3;">Исследователь<br>Практик · Творец</span>
      </div>
      <span style="font-size: 12px; color: #686D75;">26 августа · уверенность 74%</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4E2DB; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 14px; font-weight: 600;">План на неделю</span>
        <span class="tnum" style="font-size: 13px; font-weight: 600; color: #1F6F4A;">9%</span>
      </div>
      <sc-for list="{{tasks}}" as="task" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px;">
          <div style="width: 18px; height: 18px; border-radius: 5px; border: 2px solid {{task.border}}; background: {{task.fill}}; flex: none;"></div>
          <span style="font-size: 13px; color: {{task.ink}}; text-decoration: {{task.strike}};">{{task.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E4E2DB; padding: 8px 18px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around;">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <div style="min-width: 60px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <div style="width: 20px; height: 20px; border-radius: 5px; background: {{tab.ink}};"></div>
        <span style="font-size: 11px; color: {{tab.ink}};">{{tab.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      tasks: [
        { label: 'Настроить CI: линт, тесты, сборка', border: '#1F6F4A', fill: '#1F6F4A', ink: '#9C9A93', strike: 'line-through' },
        { label: 'Написать первые интеграционные тесты', border: '#CFCCC3', fill: 'transparent', ink: '#14171C', strike: 'none' },
      ],
      tabs: [
        { label: 'Главная', ink: '#14171C' },
        { label: 'Профиль', ink: '#9C9A93' },
        { label: 'План', ink: '#9C9A93' },
        { label: 'История', ink: '#9C9A93' },
      ],
    };
  }
}
</script>
</body>
</html>
