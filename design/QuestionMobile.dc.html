<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F6F4A; } a:hover { color: #145235; }
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F5F1; color: #14171C; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden;">

  <div style="padding: 16px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #E4E2DB;">
    <div style="flex: 1; height: 5px; background: #E4E2DB; border-radius: 3px; overflow: hidden;">
      <div style="width: 58%; height: 100%; background: #14171C; border-radius: 3px;"></div>
    </div>
    <span class="tnum" style="font-size: 12px; color: #4A5059; white-space: nowrap;">7 / 12</span>
    <div style="min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M4 4 L14 14 M14 4 L4 14" stroke="#4A5059" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 20px 18px; min-height: 0;">

    <div style="position: relative; padding: 14px;">
      <svg style="position: absolute; inset: 0; width: 100%; height: 100%;" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="97" height="97" rx="10" fill="none" stroke="#DCD9D1" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <rect x="1.5" y="1.5" width="97" height="97" rx="10" fill="none" stroke="#1F6F4A" stroke-width="2.5" stroke-linecap="round"
              vector-effect="non-scaling-stroke" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0.34"/>
      </svg>
      <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 16px 18px;">
        <div style="width: 42px; height: 42px; background: #4B7BEC; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>
        <div style="width: 42px; height: 42px; border-radius: 50%; background: #EC4B6E;"></div>
        <div style="width: 42px; height: 42px; border-radius: 50%; background: #EC4B6E;"></div>
        <span style="font-size: 22px; color: #9C9A93;">→</span>
        <div style="width: 42px; height: 42px; border: 2px dashed #B8B4AA; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #B8B4AA;">?</div>
      </div>
    </div>

    <h2 style="margin: 0; font-size: 18px; font-weight: 500; text-align: center;">Продолжите ряд</h2>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
        <div style="min-height: 68px; background: #FFFFFF; border: 2px solid {{opt.border}}; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 14px;">
          <sc-for list="{{opt.shapes}}" as="sh" hint-placeholder-count="3">
            <div style="width: 30px; height: 30px; background: {{sh.fill}}; border-radius: {{sh.radius}}; clip-path: {{sh.clip}};"></div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); text-align: center;">
    <span style="font-size: 12px; color: #686D75;">Ответ засчитывается сразу — вернуться назад нельзя</span>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const tri = { fill: '#4B7BEC', radius: '0', clip: 'polygon(50% 0%, 0% 100%, 100% 100%)' };
    const cir = { fill: '#EC4B6E', radius: '50%', clip: 'none' };
    const sqr = { fill: '#14B88A', radius: '6px', clip: 'none' };
    return {
      options: [
        { border: '#1F6F4A', shapes: [tri, cir, cir] },
        { border: '#E4E2DB', shapes: [cir, cir, sqr] },
        { border: '#E4E2DB', shapes: [cir, sqr, cir] },
      ],
    };
  }
}
</script>
</body>
</html>
